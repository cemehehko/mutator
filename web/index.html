<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mutator</title>
<!--
  Веб-UI сервера (фича `wui`): операций не реализует — только зовёт REST
  (`/api/v1/…`) и слушает SSE (`/api/v1/events`, одно подключение на вкладку).
  Формы строятся по JSON-схемам `GET /api/v1/ops`. Без сборки: файл вшит в
  бинарь как есть.
-->
<style>
:root {
  --bg: #16181d; --panel: #1f2229; --line: #2e323b; --text: #d6d9df;
  --dim: #8a909c; --accent: #6cb6ff; --ok: #7ccf8a; --bad: #ff7b72; --warn: #e3b341;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; }
header { display: flex; gap: 16px; align-items: baseline; padding: 10px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
header b { font-size: 16px; }
header .dim { color: var(--dim); }
#conn { margin-left: auto; font-size: 12px; }
nav button { background: none; border: 0; color: var(--dim); font: inherit; padding: 2px 6px; cursor: pointer; border-bottom: 2px solid transparent; }
nav button.on { color: var(--text); border-bottom-color: var(--accent); }
#viewer { display: flex; flex-direction: column; height: calc(100vh - 45px); }
#viewer .bar { display: flex; gap: 8px; padding: 6px 16px; border-bottom: 1px solid var(--line); }
#viewer .bar input { flex: 1; }
#screen { flex: 1; overflow: hidden; outline: none; padding: 2px 4px; font: 13px/16px var(--mono); white-space: pre; cursor: default; user-select: text; }
#screen .ln { height: 16px; }
#screen .msg { color: var(--dim); padding: 16px; white-space: normal; font-family: system-ui, sans-serif; }
main { display: grid; grid-template-columns: 220px minmax(0, 1fr) 360px; height: calc(100vh - 45px); }
@media (max-width: 900px) { main { grid-template-columns: 1fr; height: auto; } }
section { border-right: 1px solid var(--line); overflow: auto; padding: 12px 16px; }
h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); margin: 4px 0 8px; }
#ops button { display: block; width: 100%; text-align: left; background: none; border: 0; color: var(--text); padding: 6px 8px; border-radius: 4px; cursor: pointer; font: inherit; }
#ops button:hover { background: var(--panel); }
#ops button.on { background: var(--panel); color: var(--accent); }
.tag { font-size: 11px; color: var(--warn); margin-left: 4px; }
form label { display: block; margin: 10px 0 2px; font-family: var(--mono); }
form label i { color: var(--dim); font-style: normal; font-family: system-ui, sans-serif; font-size: 12px; margin-left: 6px; }
form .req { color: var(--bad); }
input[type=text], input[type=number], textarea { width: 100%; background: var(--panel); border: 1px solid var(--line); color: var(--text); padding: 6px 8px; border-radius: 4px; font: 13px var(--mono); }
textarea { min-height: 54px; resize: vertical; }
.row { display: flex; gap: 8px; margin-top: 12px; align-items: center; }
button.go { background: var(--accent); color: #0b1220; border: 0; padding: 7px 16px; border-radius: 4px; font-weight: 600; cursor: pointer; }
button.go:disabled { opacity: .5; cursor: default; }
button.small { background: var(--panel); color: var(--text); border: 1px solid var(--line); padding: 2px 8px; border-radius: 4px; cursor: pointer; font-size: 12px; }
pre { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 10px; overflow: auto; font: 12px/1.45 var(--mono); white-space: pre-wrap; word-break: break-word; }
pre.bad { border-color: var(--bad); color: var(--bad); }
#desc { color: var(--dim); white-space: pre-wrap; margin: 0 0 6px; }
.link, .run { border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; margin-bottom: 6px; font: 12px var(--mono); word-break: break-all; }
.state-Active { color: var(--ok); } .state-Error, .state-Closed { color: var(--bad); } .state-Opening { color: var(--warn); }
.run { cursor: pointer; } .run:hover { border-color: var(--accent); }
#log div { font: 11px var(--mono); color: var(--dim); border-bottom: 1px solid var(--line); padding: 2px 0; word-break: break-all; }
.empty { color: var(--dim); font-size: 12px; }
</style>
</head>
<body>
<header>
  <b>mutator</b>
  <nav><button type="button" id="tab-view" class="on">Просмотр</button><button type="button" id="tab-api">API</button></nav>
  <span class="dim" id="version"></span>
  <span class="dim" id="default"></span>
  <span id="conn" class="dim">SSE: …</span>
</header>
<div id="viewer">
  <form class="bar" id="view-open">
    <input type="text" name="file" placeholder="/путь/к/файлу.dat или resolve://SERVICE/CHANNEL">
    <button class="small">Открыть</button>
  </form>
  <div id="screen" tabindex="0"><div class="msg">Откройте файл или линк. Клавиши — как в mutator --tui, F1 — справка.</div></div>
</div>
<main id="api" hidden>
  <section>
    <h2>Операции</h2>
    <div id="ops"><div class="empty">загрузка…</div></div>
  </section>
  <section>
    <h2 id="title">Выберите операцию</h2>
    <p id="desc"></p>
    <form id="form" hidden></form>
    <div id="result"></div>
  </section>
  <section>
    <h2>Линки</h2>
    <div id="links"><div class="empty">нет открытых</div></div>
    <form id="open-link">
      <input type="text" name="url" placeholder="resolve://SERVICE/CHANNEL">
      <div class="row">
        <input type="text" name="open" placeholder="mode=seq;seq=0 (по умолчанию — online)">
        <button class="small">Открыть</button>
      </div>
    </form>
    <h2 style="margin-top:16px">История</h2>
    <div id="history"><div class="empty">пусто</div></div>
    <h2 style="margin-top:16px">События</h2>
    <div id="log"></div>
  </section>
</main>
<script>
"use strict";
// Вход по ссылке /?token=…: сервер уже поставил cookie — токен из адресной
// строки убираем, чтобы он не остался в истории и закладках.
if (new URLSearchParams(location.search).has("token")) history.replaceState(null, "", location.pathname);
const api = (p) => "/api/v1" + p;
const $ = (id) => document.getElementById(id);
const el = (tag, props = {}, ...kids) => {
  const e = Object.assign(document.createElement(tag), props);
  for (const k of kids) e.append(k);
  return e;
};

let ops = [];
let current = null;
const waiting = new Map();   // op_id → функция показа итога
const found = new Map();     // op_id → найденное по ходу скана
const history = [];          // последние запуски этой вкладки
const links = new Map();     // url → состояние

async function problem(r) {
  try { const p = await r.json(); return p.detail || p.title || r.statusText; }
  catch { return r.status + " " + r.statusText; }
}

async function load() {
  const [info, list] = await Promise.all([
    fetch(api("/info")).then((r) => r.json()),
    fetch(api("/ops")).then((r) => r.json()),
  ]);
  $("version").textContent = "v" + info.version;
  $("default").textContent = info.default ? "по умолчанию: " + info.default : "";
  // Без файла по умолчанию — список линков resolve.
  if (info.default) $("view-open").file.value = info.default;
  openView(info.default || "");
  ops = list;
  const box = $("ops");
  box.replaceChildren();
  for (const op of ops) {
    const b = el("button", { type: "button", textContent: op.name });
    if (op.long) b.append(el("span", { className: "tag", textContent: "долгая" }));
    b.onclick = () => pick(op, b);
    box.append(b);
  }
  for (const l of await fetch(api("/links")).then((r) => r.json())) links.set(l.url, l);
  drawLinks();
}

function pick(op, button) {
  current = op;
  for (const b of $("ops").children) b.classList.toggle("on", b === button);
  $("title").textContent = op.name;
  $("desc").textContent = op.description || "";
  $("result").replaceChildren();
  const form = $("form");
  form.hidden = false;
  form.replaceChildren();
  const props = op.parameters.properties || {};
  const required = new Set(op.parameters.required || []);
  // `file` — первым: без него (и без файла по умолчанию) ни одна операция не идёт.
  const names = Object.keys(props).sort((a, b) => (b === "file") - (a === "file"));
  for (const name of names) {
    const p = props[name];
    const label = el("label", { textContent: name });
    if (required.has(name)) label.append(el("span", { className: "req", textContent: " *" }));
    if (p.description) label.append(el("i", { textContent: p.description }));
    let input;
    if (p.type === "boolean") {
      input = el("input", { type: "checkbox", name });
    } else if (p.type === "integer" || p.type === "number") {
      input = el("input", { type: "number", name });
    } else if (name === "expr" || name === "code") {
      input = el("textarea", { name, placeholder: "seq > 100" });
    } else {
      input = el("input", { type: "text", name });
      if (p.type === "array") input.placeholder = "через запятую";
      if (name === "file") input.placeholder = $("default").textContent || "/путь/к/файлу.dat или resolve://…";
    }
    input.dataset.type = p.type;
    form.append(label, input);
  }
  const go = el("button", { className: "go", textContent: "Выполнить" });
  form.append(el("div", { className: "row" }, go));
  form.onsubmit = (e) => { e.preventDefault(); run(op, form, go); };
}

function args(form) {
  const out = {};
  for (const i of form.querySelectorAll("[name]")) {
    const t = i.dataset.type;
    if (t === "boolean") { if (i.checked) out[i.name] = true; continue; }
    const v = i.value.trim();
    if (!v) continue;
    if (t === "integer" || t === "number") out[i.name] = Number(v);
    else if (t === "array") out[i.name] = v.split(",").map((s) => s.trim()).filter(Boolean);
    else out[i.name] = v;
  }
  return out;
}

function show(text, bad) {
  $("result").replaceChildren(el("pre", { className: bad ? "bad" : "", textContent: text }));
}

async function run(op, form, go) {
  const a = args(form);
  go.disabled = true;
  const entry = { op: op.name, args: a, at: new Date(), state: "…", text: "" };
  history.unshift(entry);
  history.length = Math.min(history.length, 50);
  const done = (text, bad) => {
    entry.state = bad ? "ошибка" : "готово";
    entry.text = text;
    entry.bad = bad;
    if (current === op) show(text, bad);
    drawHistory();
    go.disabled = false;
  };
  drawHistory();
  show(op.long ? "запуск…" : "…");
  try {
    const r = await fetch(api("/ops/" + op.name), {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify(a),
    });
    if (r.status === 202) {
      const { op_id } = await r.json();
      entry.state = op_id + " идёт";
      drawHistory();
      show(op_id + ": идёт скан, найденное — по мере скана");
      found.set(op_id, { text: "", show: () => current === op });
      waiting.set(op_id, done);
      // Итог мог прийти раньше подписки — спросить запуск.
      const run = await fetch(api("/runs/" + op_id)).then((x) => x.json());
      if (run.state === "finished") finish(op_id, run.result, false);
      if (run.state === "failed") finish(op_id, run.error, true);
    } else if (r.ok) {
      done((await r.json()).result, false);
    } else {
      done(await problem(r), true);
    }
  } catch (e) {
    done(String(e), true);
  }
}

function finish(op_id, text, bad) {
  const f = waiting.get(op_id);
  if (!f) return;
  waiting.delete(op_id);
  found.delete(op_id);
  f(text, bad);
}

// Найденное поиском — сразу, не дожидаясь конца скана.
function item(op_id, text) {
  const acc = found.get(op_id);
  if (!acc) return;
  acc.text += text;
  if (acc.show()) show(acc.text + "\n… скан идёт");
}

function drawHistory() {
  const box = $("history");
  box.replaceChildren();
  if (!history.length) box.append(el("div", { className: "empty", textContent: "пусто" }));
  for (const h of history) {
    const d = el("div", { className: "run" });
    d.append(
      el("div", { textContent: h.at.toLocaleTimeString() + "  " + h.op + "  · " + h.state }),
      el("div", { className: "empty", textContent: JSON.stringify(h.args) }),
    );
    d.onclick = () => h.text && show(h.text, h.bad);
    box.append(d);
  }
}

function drawLinks() {
  const box = $("links");
  box.replaceChildren();
  if (!links.size) box.append(el("div", { className: "empty", textContent: "нет открытых" }));
  for (const l of links.values()) {
    const close = el("button", { className: "small", type: "button", textContent: "Закрыть" });
    close.onclick = async () => {
      const r = await fetch(api("/links?url=" + encodeURIComponent(l.url)), { method: "DELETE" });
      if (r.ok) { links.delete(l.url); drawLinks(); }
    };
    const use = el("button", { className: "small", type: "button", textContent: "В file" });
    use.onclick = () => { const f = document.querySelector("#form [name=file]"); if (f) f.value = l.url; };
    box.append(el("div", { className: "link" },
      el("div", { textContent: l.url }),
      el("div", { className: "state-" + l.state,
        textContent: l.state + (l.online ? " · онлайн" : "") + " · " + l.count + (l.error ? " · " + l.error : "") }),
      el("div", { className: "row" }, use, close)));
  }
}

$("open-link").onsubmit = async (e) => {
  e.preventDefault();
  const f = e.target;
  const url = f.url.value.trim();
  if (!url) return;
  const body = { url };
  if (f.open.value.trim()) body.open = f.open.value.trim();
  const r = await fetch(api("/links"), {
    method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body),
  });
  if (r.ok) { const l = await r.json(); if (l) links.set(l.url, l); drawLinks(); }
  else show(await problem(r), true);
};

function log(text) {
  const box = $("log");
  box.prepend(el("div", { textContent: new Date().toLocaleTimeString() + " " + text }));
  while (box.children.length > 200) box.lastChild.remove();
}

// Одно подключение SSE на вкладку: запуски, линки, resync.
function listen() {
  const es = new EventSource(api("/events"));
  es.onopen = () => { $("conn").textContent = "SSE: подключено"; };
  es.onerror = () => { $("conn").textContent = "SSE: переподключение…"; };
  es.addEventListener("op", (m) => {
    const e = JSON.parse(m.data);
    log(e.type + " " + e.op_id + " " + e.op);
    if (e.type === "op_item") { item(e.op_id, e.text); return; }
    if (e.type === "op_finished") finish(e.op_id, e.result, false);
    if (e.type === "op_failed") finish(e.op_id, e.error, true);
  });
  es.addEventListener("link", (m) => {
    const l = JSON.parse(m.data);
    links.set(l.url, l);
    drawLinks();
  });
  es.addEventListener("resync", (m) => {
    log("resync: " + JSON.parse(m.data).reason);
    fetch(api("/links")).then((r) => r.json()).then((ls) => {
      links.clear();
      for (const l of ls) links.set(l.url, l);
      drawLinks();
    });
  });
}

// --- Просмотр: вид на сервере (тот же Desk, что у --tui), страница рисует
// его кадры и отдаёт ввод. Своего просмотра здесь нет.
let view = null, frames = null, file = null, cw = 8, ch = 16;
let pending = [], busy = false, lines = [], split = null, pressed = false, splitting = false;

function measure() {
  const probe = el("span", { textContent: "M".repeat(100) });
  const ln = el("div", { className: "ln" }, probe);
  $("screen").append(ln);
  cw = probe.getBoundingClientRect().width / 100;
  ch = ln.getBoundingClientRect().height || 16;
  ln.remove();
}

// Ввод копится, пока предыдущая пачка в пути: порядок клавиш сохраняется.
// Пачка, на которую нет ответа 5 с, не держит следующих.
function send(i) {
  if (!view) return;
  pending.push(i);
  if (!busy) flush();
}
async function flush() {
  busy = true;
  while (pending.length && view) {
    const batch = pending;
    pending = [];
    try {
      const r = await fetch(api("/views/" + view + "/input"), {
        method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(batch),
        signal: AbortSignal.timeout(5000),
      });
      // Вид закрыт (вкладка долго спала, сервер перезапущен) — открыть заново.
      if (r.status === 404 || r.status === 410) { busy = false; reopen(); return; }
    } catch { /* таймаут или сеть — следующая пачка пойдёт сама */ }
  }
  busy = false;
}

function size() {
  if (!view) return;
  const b = $("screen").getBoundingClientRect();
  if (!b.width || !b.height) return;
  send({ size: [Math.max(20, Math.floor((b.width - 8) / cw)), Math.max(6, Math.floor((b.height - 4) / ch))] });
}

function line(runs) {
  const div = el("div", { className: "ln" });
  for (const [t, fg, bg] of runs) {
    const s = el("span", { textContent: t });
    s.style.color = fg;
    if (bg) s.style.background = bg;
    div.append(s);
  }
  return div;
}

// Кадр: целиком (`full`) или только изменившиеся строки — их и меняем.
function draw(f) {
  const screen = $("screen");
  split = f.split;
  if (f.full) {
    lines = f.lines.map(line);
    screen.replaceChildren(...lines);
    return;
  }
  for (const [i, runs] of Object.entries(f.lines)) {
    const fresh = line(runs);
    if (lines[i]) lines[i].replaceWith(fresh);
    else screen.append(fresh);
    lines[i] = fresh;
  }
}

function reopen() {
  if (file !== null) openView(file);
}

// Поколение открытия: ответ и кадры применяются, только если это всё ещё
// последнее «Открыть» — два быстрых нажатия не оставят чужой вид и брошенный
// поток кадров.
let opening = 0;

async function openView(name) {
  const gen = ++opening;
  file = name;
  if (frames) frames.close();
  frames = null;
  if (view) fetch(api("/views/" + view), { method: "DELETE" });
  view = null;
  pending = [];
  $("screen").replaceChildren(el("div", { className: "msg", textContent: "открываю " + (name || "") + "… (линк ждём до 20 с)" }));
  const r = await fetch(api("/views"), {
    method: "POST", headers: { "content-type": "application/json" },
    body: JSON.stringify(name ? { file: name } : {}),
  });
  const body = r.ok ? await r.json() : null;
  if (gen !== opening) {
    // Опоздавший ответ: его вид никому не нужен.
    if (body) fetch(api("/views/" + body.id), { method: "DELETE" });
    return;
  }
  if (!body) {
    $("screen").replaceChildren(el("div", { className: "msg", textContent: await problem(r) }));
    return;
  }
  view = body.id;
  const es = new EventSource(api("/views/" + view + "/frames"));
  frames = es;
  es.addEventListener("frame", (m) => { if (frames === es) draw(JSON.parse(m.data)); });
  // Сервер вида не знает (перезапуск, вид закрыт) — EventSource сдаётся: открыть заново.
  es.onerror = () => { if (es.readyState === EventSource.CLOSED && frames === es) setTimeout(reopen, 1000); };
  measure();
  size();
  $("screen").focus();
}

$("view-open").onsubmit = (e) => { e.preventDefault(); openView(e.target.file.value.trim()); };

const named = {
  ArrowUp: "Up", ArrowDown: "Down", ArrowLeft: "Left", ArrowRight: "Right", Enter: "Enter",
  Escape: "Esc", Backspace: "Backspace", Delete: "Delete", PageUp: "PageUp", PageDown: "PageDown",
  Home: "Home", End: "End", F1: "F1", F5: "F5",
};
$("screen").addEventListener("keydown", (e) => {
  let i = null;
  if (e.key === "Tab") i = { key: e.shiftKey ? "BackTab" : "Tab" };
  else if (named[e.key]) i = { key: named[e.key] };
  else if (e.ctrlKey && !e.altKey && e.key.length === 1) {
    // Ctrl+C и Ctrl+V — браузеру: копировать и вставить.
    if ("cv".includes(e.key.toLowerCase())) return;
    i = { ctrl: e.key.toLowerCase() };
  } else if (e.key.length === 1 && !e.metaKey) i = { char: e.key };
  if (!i) return;
  e.preventDefault();
  send(i);
});
// Вставка — строкой знаков: в строку фильтра или поиска.
$("screen").addEventListener("paste", (e) => {
  const t = e.clipboardData.getData("text");
  for (const c of t) if (c !== "\n" && c !== "\r") send({ char: c });
  e.preventDefault();
});
// Клетка под мышью: строка — по самой строке экрана (без пересчёта пикселей,
// при любом масштабе), столбец — по ширине знака.
function cell(e) {
  const ln = e.target.closest && e.target.closest(".ln");
  const b = $("screen").getBoundingClientRect();
  const row = ln ? lines.indexOf(ln) : Math.floor((e.clientY - b.top - 2) / ch);
  const x = ln ? e.clientX - ln.getBoundingClientRect().left : e.clientX - b.left - 4;
  return [row, Math.max(0, Math.floor(x / cw))];
}
// Нажатие — щелчок; на границе детали с него начинают тянуть её, и сервер
// двигает границу за мышью до отпускания (как в терминале). Выделение текста
// браузером — только с Shift, как в терминале с мышью.
$("screen").addEventListener("mousedown", (e) => {
  $("screen").focus();
  if (e.button !== 0 || !view || e.shiftKey) return;
  e.preventDefault();
  const at = cell(e);
  splitting = at[0] === split;
  pressed = true;
  send({ click: at });
});
$("screen").addEventListener("mousemove", (e) => {
  const at = cell(e);
  $("screen").style.cursor = at[0] === split || splitting ? "row-resize" : "default";
  if (splitting && e.buttons & 1) send({ drag: at });
});
window.addEventListener("mouseup", () => {
  if (pressed) { pressed = false; splitting = false; send("release"); }
});
$("screen").addEventListener("wheel", (e) => {
  e.preventDefault();
  send({ wheel: e.deltaY > 0 ? 3 : -3 });
}, { passive: false });
// Вернулись в окно или на вкладку — клавиши снова экрану.
function refocus() {
  if (!$("viewer").hidden && document.activeElement !== $("view-open").file) $("screen").focus();
}
window.addEventListener("focus", refocus);
document.addEventListener("visibilitychange", () => { if (!document.hidden) refocus(); });
let resizing = null;
window.addEventListener("resize", () => { clearTimeout(resizing); resizing = setTimeout(size, 150); });

function tab(which) {
  const viewer = which === "view";
  $("viewer").hidden = !viewer;
  $("api").hidden = viewer;
  $("tab-view").classList.toggle("on", viewer);
  $("tab-api").classList.toggle("on", !viewer);
  if (viewer) { size(); $("screen").focus(); }
}
$("tab-view").onclick = () => tab("view");
$("tab-api").onclick = () => tab("api");

load().catch((e) => show("не загрузилось: " + e, true));
listen();
</script>
</body>
</html>
