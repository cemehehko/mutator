[package]
name = "tll-mutator"
version = "0.0.16"
edition = "2021"
description = "Просмотр датников TLL: таблица сообщений, фильтр, поиск — в окне и в терминале"

[lib]
name = "tui_patch"

[[bin]]
name = "mutator"
path = "src/main.rs"
required-features = ["tll"]

[features]
default = ["gui", "tll"]
# Встроенный бэкенд TLL (libtll грузится при открытии TLL-файла). Без него
# библиотека собирается для внешних бэкендов (`io::register`), бинарник — нет.
tll = []
# GUI (окно egui + TUI-в-окне по F2). Выключайте для сборки только TUI
# (--tui) и --dump на серверах без X11/Wayland/Vulkan (Ubuntu 20.04+ headless).
gui = ["dep:eframe"]
# Сервер для тестировщиков: читающие инструменты агента по REST и SSE
# (`--serve ADDR`). Сам по себе ни окна, ни терминала не тянет.
rest = ["dep:axum", "tokio/rt-multi-thread", "tokio/net", "tokio/signal"]
# MCP поверх тех же операций: streamable HTTP на `/mcp` (с токеном) и stdio.
mcp = ["rest", "dep:rmcp"]
# Веб-UI на `/`: одна страница `web/index.html` в бинаре, без сборки.
wui = ["rest"]

[dependencies]
# Библиотеки бэкендов грузятся при открытии файла своего формата.
libloading = "0.8"
# Терминальный запуск `mutator`: сырой режим, альтернативный экран.
crossterm = "0.29"
# Пресеты колонок пользователя (`~/.config/tui-patch/presets.toml`).
serde = { version = "1", features = ["derive"] }
toml = "0.8"
# Режим агента: OpenAI-совместимый API. TLS — rustls с встроенными корнями,
# чтобы сборка в Docker не зависела от OpenSSL.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "rustls-tls",
] }
# Поток агента: асинхронный HTTP в отдельном потоке, каналы команд и событий.
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
futures-util = "0.3"
# Транспорт SSE поверх `reqwest`: переводы строк, многострочный `data:`,
# комментарии — по стандарту; payload кадра разбираем свой.
eventsource-stream = "0.2"
# Тело запросов и ответов LLM, схемы инструментов.
serde_json = "1"
# Сервер (фича `rest`): HTTP и SSE.
axum = { version = "0.8", optional = true }
# MCP (фича `mcp`): сервер, streamable HTTP и stdio.
rmcp = { version = "3.8", optional = true, default-features = false, features = [
    "server",
    "transport-streamable-http-server",
    "transport-io",
] }

# Общие типы цветов/шрифтов из egui используются и в TUI (терминал),
# и в окне. Само eframe (с wgpu) тянется только при фиче "gui".
egui = "0.35"

# Окно (опционально). Только настольные системы.
eframe = { version = "0.35", optional = true, default-features = false, features = ["default_fonts", "wgpu"] }

# Под Linux winit без x11/wayland не собирается; окно там не целевое, но
# библиотека и тесты должны собираться (проверки идут в Docker).
[target.'cfg(all(target_os = "linux", feature = "gui"))'.dependencies]
eframe = { version = "0.35", optional = true, default-features = false, features = ["default_fonts", "wgpu", "x11"] }

# Родное меню и диалог выбора файла — только macOS (на Linux у `rfd` тянется
# gtk3/portal, а окно там не целевое). Подключаются кодом под `feature = "gui"`.
[target.'cfg(target_os = "macos")'.dependencies]
muda = "0.21"
rfd = "0.17"

[dev-dependencies]
# Эталоны python-tll лежат в JSON (`tests/data/*.json`).
serde_json = "1"
# Клиент MCP для `tests/mcp.rs`: HTTP и stdio дочернего процесса.
rmcp = { version = "3.8", default-features = false, features = [
    "client",
    "transport-streamable-http-client-reqwest",
    "transport-child-process",
] }

[build-dependencies]
# libtll ставится системно (Homebrew, deb); путь берём у pkg-config.
pkg-config = "0.3"

# Сценарные тесты на TLL-эталонах (`tests/data/*.dat`) требуют бэкенд TLL.
[[test]]
name = "agent"
path = "tests/agent.rs"
required-features = ["tll"]

[[test]]
name = "data_layer"
path = "tests/data_layer.rs"
required-features = ["tll"]

[[test]]
name = "desk"
path = "tests/desk.rs"
required-features = ["tll"]

[[test]]
name = "glue"
path = "tests/glue.rs"
required-features = ["tll"]

[[test]]
name = "golden"
path = "tests/golden.rs"
required-features = ["tll"]

[[test]]
name = "stream"
path = "tests/stream.rs"
required-features = ["tll"]

[[test]]
name = "link"
path = "tests/link.rs"
required-features = ["tll"]

[[test]]
name = "mcp"
path = "tests/mcp.rs"
required-features = ["mcp", "tll"]

[[test]]
name = "serve"
path = "tests/serve.rs"
required-features = ["rest", "tll"]

[[test]]
name = "view"
path = "tests/view.rs"
required-features = ["wui", "tll"]

[[test]]
name = "tui"
path = "tests/tui.rs"
required-features = ["tll"]

# GUI-тесты (window.rs, probe_layout.rs) используют egui напрямую
# для headless-проверок раскладки. Они не должны собираться при
# --no-default-features (только TUI). Поэтому явно требуем фичу "gui".
[[test]]
name = "window"
path = "tests/window.rs"
required-features = ["gui", "tll"]

[[test]]
name = "probe_layout"
path = "tests/probe_layout.rs"
required-features = ["gui", "tll"]
